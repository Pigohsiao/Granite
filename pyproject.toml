[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pigo-notes"
version = "0.1.0"
description = "A Windows-local Markdown Vault desktop app"
requires-python = ">=3.12"
dependencies = [
  "Markdown>=3.7",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
